<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Giờ bận của giáo viên</title>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/busy.js"></script>
</head>
<body>
  <header>
    <h1>Giờ bận của giáo viên</h1>
    <p>Đánh dấu tiết hoặc cả ngày giáo viên không thể dạy · áp dụng cho mọi tuần của học kỳ</p>
  </header>
  <main>
    <section>
      <div class="admin-toolbar">
        <div>
          <h2>Giờ bận lặp lại hằng tuần</h2>
        </div>
        <div>
          <a class="button-link" href="/timetable">Xếp lịch</a>
          <a class="button-link" href="/admin">Quản trị dữ liệu</a>
        </div>
      </div>
      <button id="save" type="button" disabled>Lưu giờ bận giáo viên đang chọn</button>
      <div id="message" class="status" role="status">Đang tải dữ liệu...</div>
      <div id="calendar"></div>
    </section>
  </main>
</body>
</html>
